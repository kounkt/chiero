<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="水から出たものを集めています。">

<meta property="og:description" content="水から出たものを集めています。">
<meta property="og:type" content="article">
<meta property="og:url" content="https://chiero.jp/tokoyo/sora/">
<meta property="og:image" content="https://chiero.jp/tokoyo/ogp/ch_sora.png">

<meta name="twitter:title" content="常世 第二の観測 空">

<link rel="canonical" href="https://chiero.jp/tokoyo/sora/">
<style>
  :root{--red:#E60012;--ink:#F2F2F4;--sub:#9A9AA0;--faint:#6E6E74;
    --paper:#0B0B0D;--card:#0E0E11;--line:#26262B;
    --g:"Hiragino Sans","Yu Gothic Medium","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    --m:"Hiragino Mincho ProN","Yu Mincho",serif}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--g);
    font-size:15.5px;line-height:2;font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;padding:0 24px}
  .back{display:inline-block;margin:46px 0 0;font-size:12px;letter-spacing:.14em;
    color:var(--faint);text-decoration:none}
  .back:hover{color:var(--sub)}
  header{padding:34px 0 30px}
  /* 赤は落款だけ（DESIGN.md 赤一点）。画と同じ画面に赤い点を二つ置かない */
  .no{font-size:11.5px;letter-spacing:.2em;color:var(--faint);margin:0 0 6px}
  h1{font-family:var(--m);font-weight:600;font-size:clamp(30px,7vw,42px);
    letter-spacing:.14em;line-height:1.2;margin:0}
  .ch{font-size:12.5px;letter-spacing:.12em;color:var(--sub);margin:14px 0 0}
  .ch a{color:var(--sub);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
  .ch a:hover{color:var(--ink)}
  figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden}
  figure canvas{width:100%!important;height:auto!important;display:block}
  /* 時を握る帯。作品は時刻の関数なので、時刻を手に渡すのは説明ではなく作品そのもの */
  .time{padding:12px 16px 13px;border-top:1px solid var(--line);
    cursor:ew-resize;touch-action:none;-webkit-user-select:none;user-select:none}
  .rail{position:relative;height:1px;background:#2E2E34}
  .rail::after{content:"";position:absolute;inset:-11px 0}
  .tm{position:absolute;top:-6px;width:2px;height:13px;background:var(--ink);margin-left:-1px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 16px 14px;border-top:1px solid var(--line)}
  .sec{font-size:11.5px;color:var(--faint);white-space:nowrap}
  .sec #cnt{font-variant-numeric:tabular-nums}
  #art{cursor:pointer}
  button.ghost{background:transparent;color:var(--sub);box-shadow:inset 0 0 0 1px var(--line);
    font-weight:400}
  button.ghost:hover{color:var(--ink);box-shadow:inset 0 0 0 1px #3A3A42}
  .btns{display:flex;gap:8px}
  @media (max-width:430px){ .sec{display:none} }

  /* 全画面。点は実ピクセル1個という掟があるので、拡大せず作り直して原寸で見せる */
  #fig:fullscreen,#fig:-webkit-full-screen,#fig.full{
    background:var(--paper);border:0;border-radius:0;
    display:flex;flex-direction:column;justify-content:center}
  #fig.full{position:fixed;inset:0;z-index:99;overflow:auto}
  /* kami は canvas の属性しか触らない。原寸（1点=実ピクセル1個）は CSS 幅で決まるので、
     全画面では作り直した大きさをそのまま指定する */
  #fig:fullscreen canvas,#fig:-webkit-full-screen canvas,#fig.full canvas{
    width:var(--fsw)!important;height:auto!important;margin:0 auto;display:block}
  #fig:fullscreen .time,#fig:fullscreen .bar,
  #fig:-webkit-full-screen .time,#fig:-webkit-full-screen .bar,
  #fig.full .time,#fig.full .bar{width:100%;max-width:760px;margin:0 auto}
  button{font-family:var(--g);font-size:11.5px;font-weight:700;letter-spacing:.06em;
    color:var(--paper);background:var(--ink);border:0;border-radius:3px;
    padding:8px 13px;cursor:pointer;white-space:nowrap}
  button:hover{background:var(--sub)}
  button.done{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
  .obs{font-size:15px;line-height:2.2;color:var(--ink);margin:38px 0 0}
  .obs p{margin:0 0 20px}
  .obs p:last-child{margin-bottom:0}
  .obs strong{font-weight:400;color:#fff}
  .fp{margin:44px 0 0;padding:20px 20px 21px;background:var(--card);
    border:1px solid var(--line);border-radius:5px}
  .fp .lbl{font-size:11.5px;letter-spacing:.14em;color:var(--faint);margin:0 0 8px}
  .fp code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;line-height:1.85;
    color:var(--sub);word-break:break-all;display:block}
  .fp .say{font-size:13px;line-height:2.05;color:var(--faint);margin:15px 0 0}
  .fp .how{font-size:12px;color:var(--faint);margin:13px 0 0;line-height:1.9}
  .fp pre{font-family:"SF Mono",Menlo,monospace;font-size:11.5px;color:var(--sub);
    background:#08080A;border:1px solid var(--line);border-radius:3px;
    padding:10px 12px;margin:8px 0 0;overflow-x:auto}
  #warn{display:none;margin:12px 0 0;font-size:12.5px;color:var(--red);line-height:1.9}
  nav{display:flex;justify-content:space-between;gap:16px;margin:54px 0 0;
    border-top:1px solid var(--line);padding-top:22px;font-size:13px}
  nav a{color:var(--sub);text-decoration:none;max-width:46%}
  nav a:hover{color:var(--ink)}
  nav .d{font-size:10.5px;letter-spacing:.16em;color:var(--faint);display:block}
  nav .r{text-align:right;margin-left:auto}
  footer{margin:44px 0 0;border-top:1px solid var(--line);padding:26px 0 90px;
    display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;font-size:13px;color:var(--faint)}
  footer a{color:var(--sub);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
  footer a:hover{color:var(--ink)}
  @media (max-width:560px){.wrap{padding:0 20px}}
  .lead{font-size:15px;line-height:2.2;color:var(--ink);margin:34px 0 0;max-width:34em}
  .lead p{margin:0 0 20px}
  .lead p:last-child{margin-bottom:0}
  /* 赤は落款だけ（DESIGN.md 赤一点）。章の状態は色でなく言葉で伝える */
  .st{display:inline-block;font-size:11px;letter-spacing:.12em;margin:26px 0 0;
    padding:4px 12px;border-radius:3px;background:#1A1A1F;color:var(--sub)}
  .list{display:grid;gap:26px;margin:46px 0 0;
    grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
  .item{background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .item canvas{width:100%!important;height:auto!important;display:block}
  .item .bar2{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px 12px;border-top:1px solid var(--line)}
  .item .bar2 a{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:inherit}
  .item .btns{display:flex;gap:7px;flex:none}
  .item a:hover .nm{border-bottom-color:var(--sub)}
  .item .nm{font-family:var(--m);font-size:16px;letter-spacing:.1em;
    border-bottom:1px solid transparent;padding-bottom:1px}
  .item:fullscreen,.item.full{background:var(--paper);border:0;
    display:flex;flex-direction:column;justify-content:center}
  .item.full{position:fixed;inset:0;z-index:99;overflow:auto}
  .item:fullscreen canvas,.item.full canvas{
    width:var(--fsw)!important;height:auto!important;margin:0 auto;display:block}
  .item:fullscreen .bar2,.item.full .bar2{width:100%;max-width:760px;margin:0 auto}
  .item .no{font-size:10.5px;letter-spacing:.16em;color:var(--faint)}
  .wrap{max-width:960px}
</style>

<div class="wrap">
  <a class="back" href="../">← 常世</a>

  <header>
    <p class="no">第二の観測 ・ 2点</p>
    <h1>空</h1>
    <div class="lead">
    <p>水から出たものを集めています。</p>
    <p>ここに置いてあるのは、そのものの姿ではありません。<br>
     こちらへの写り方です。</p>
    <p>蝶の翅は、向こう側ではずっと平らなままです。<br>
     短く見えるのは、こちらへ傾いているからです。</p>
    <p>航跡に見えているのも、軌道ではありません。<br>
     通ってきた跡です。</p>
    <p>どちらも、こちらから見たときにだけ、そう見えます。</p>
    </div>
    
  </header>

  <div class="list" id="list"></div>

  <nav>
    <a class="l" href="../umi/"><span class="d">前の章</span>第一の観測　海</a>
    <a class="r" href="../nanonai/"><span class="d">次の章</span>第三の観測　名のないもの</a>
  </nav>

  <footer>
    <span>常世 — CHIERO</span>
    <a href="https://chiero.jp/">chiero.jp</a>
    <a href="../">観測の一覧</a>
  </footer>
</div>

<script src="../kami.js?v=202608011921"></script>
<script src="../koe.js?v=202608011921"></script>
<script src="../tsumami.js?v=202608011921"></script>
<script src="../works.js?v=202608011921"></script>
<script>
const MINE = ["011_chou","014_kouseki"];
const OBSL = {"011_chou":"前の翅と後ろの翅は、少しずれて打ちます。","014_kouseki":"太陽は、止まっていません。"};
const list = document.getElementById('list');
for (const slug of MINE) {
  const w = WORKS.find(x => x.slug === slug);
  const d = document.createElement('div'); d.className = 'item';
  const box = document.createElement('div'); d.appendChild(box); list.appendChild(d);
  let kk = kami(Object.assign({ mount: box, size: 460, step: TAU / 300 }, STYLE, w));
  const a = document.createElement('a'); a.href = '../' + slug.slice(0, 3) + '/';
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = w.name;
  const no = document.createElement('span'); no.className = 'no';
  no.textContent = '観測 ' + slug.slice(0, 3);
  a.append(nm, no);
  // 作品が見えるところなら、どこでも聴けて全画面にできる
  const hb = document.createElement('button'); hb.className = 'ghost'; hb.textContent = '聴く';
  TSUMAMI.hear(hb, w, () => kk);
  const fb = document.createElement('button'); fb.className = 'ghost'; fb.textContent = '全画面';
  TSUMAMI.full(fb, d, (px) => {
    const at = kk.now(); box.innerHTML = '';
    kk = kami(Object.assign({ mount: box, size: px || 460, step: TAU / 300 }, STYLE, w));
    kk.seek(at - 34 * kk.step);
    for (let i = 0; i < 34; i++) kk.advance();
  });
  const sb = document.createElement('button'); sb.className = 'ghost'; sb.textContent = '共有';
  TSUMAMI.share(sb, { title: '常世 観測 ' + slug.slice(0, 3) + ' ' + w.name,
    lead: OBSL[slug] || '', url: 'https://chiero.jp/tokoyo/' + slug.slice(0, 3) + '/' });
  const g2 = document.createElement('div'); g2.className = 'btns'; g2.append(hb, fb, sb);
  const bar2 = document.createElement('div'); bar2.className = 'bar2';
  bar2.append(a, g2); d.appendChild(bar2);
}
</script>
</html>
