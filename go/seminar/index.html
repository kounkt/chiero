<!-- 出口：録画セミナー「AI社員が稼いだ日」の視聴ページ（UTAGE ファネル「AI社員セミナー」・2026-10-24 追加）。公式LINE のキーワード応答「セミナー」（?c=line_kw）・ステップ D8（?c=line_d8）・一斉配信の本文には、UTAGE の URL でなくこの URL を書く（UTAGE 側の URL が変わっても LINE の文を直さずに済む）。転送先は noscript の行と id="go" のリンクの2行（同じ URL にする）。出口ごとの数は Cloudflare Web Analytics のページの道（/go/seminar/）と utm_content で数える。手順は /go/README.md -->
<noscript><meta http-equiv="refresh" content="1; url=https://utage-system.com/p/7hYlcTu3lduk?utm_source=line&amp;utm_medium=official&amp;utm_campaign=ai_shain_seminar&amp;utm_content=direct"></noscript>

<body>
<main>
<p>録画セミナー「AI社員が稼いだ日」のページへ移動しています。</p>
<p>画面が切り替わらない時は、下のリンクから開いてください。</p>
<p><a id="go" href="https://utage-system.com/p/7hYlcTu3lduk?utm_source=line&amp;utm_medium=official&amp;utm_campaign=ai_shain_seminar&amp;utm_content=direct">録画セミナーのページへ進む</a></p>
</main>
<script>
(function () {
  // 分析の記録が届くように、少し待ってから移動する。転送先はリンク（id="go"）の href から読む。
  var link = document.getElementById('go');
  var dest = new URL(link.getAttribute('href'));
  var c = new URLSearchParams(location.search).get('c');
  // 英数字・ハイフン・アンダースコアの 1〜40 字だけを通す。それ以外は既定の direct。
  dest.searchParams.set('utm_content', c && /^[A-Za-z0-9_-]{1,40}$/.test(c) ? c : 'direct');
  link.href = dest.href;
  setTimeout(function () { location.replace(dest.href); }, 700);
})();
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "87c0b3b3197c484598ee1d3d073b56df"}'></script>
