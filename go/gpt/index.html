<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>講座のページへ移動しています｜株式会社CHIERO</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
body{margin:0;font-family:"Hiragino Sans","Yu Gothic Medium","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;color:#0E0E0E;background:#FFFFFF;font-size:16px;line-height:1.9;font-feature-settings:"palt" 1}
main{max-width:560px;margin:0 auto;padding:72px 22px}
p{margin:0 0 12px;color:#565656}
a{color:#E60012;font-weight:700}
</style>
<!-- 転送先（既定）: 下の noscript の行と、本文の id="go" のリンクの行。2行とも同じURLにする（手順は /go/README.md） -->
<noscript><meta http-equiv="refresh" content="0; url=https://utage-system.com/p/tyquKDxAqSOo?utm_source=youtube&amp;utm_medium=qr&amp;utm_campaign=ai_gpt_youtube&amp;utm_content=qr"></noscript>
</head>
<body>
<main>
<p>講座のページへ移動しています。</p>
<p>画面が切り替わらない時は、下のリンクから開いてください。</p>
<p><a id="go" href="https://utage-system.com/p/tyquKDxAqSOo?utm_source=youtube&amp;utm_medium=qr&amp;utm_campaign=ai_gpt_youtube&amp;utm_content=qr">講座のページへ進む</a></p>
</main>
<script>
(function () {
  // 転送先はリンク（id="go"）の href から読む。ここに URL は書かない。
  var link = document.getElementById('go');
  var dest = new URL(link.getAttribute('href'));
  var c = new URLSearchParams(location.search).get('c');
  // 英数字・ハイフン・アンダースコアの 1〜40 字だけを通す。それ以外は既定の qr。
  dest.searchParams.set('utm_content', c && /^[A-Za-z0-9_-]{1,40}$/.test(c) ? c : 'qr');
  link.href = dest.href;
  location.replace(dest.href);
})();
</script>
</body>
</html>
