<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>講座用LINEの登録｜株式会社CHIERO</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
// ==== 受付の切り替え（この1行だけを変える。手順は /go/README.md） ====
// false = 止める（どの識別子で来ても転送しない）／ true = 開ける（下の ROUTES の登録経路へ送る）
var OPEN = true;
// =====================================================================
if (OPEN) document.documentElement.className = 'open';
</script>
<style>
body{margin:0;font-family:"Hiragino Sans","Yu Gothic Medium","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;color:#0E0E0E;background:#FFFFFF;font-size:16px;line-height:1.9;font-feature-settings:"palt" 1}
main{max-width:560px;margin:0 auto;padding:72px 22px}
h1{margin:0 0 20px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;font-size:min(22px,5.6vw);line-height:1.6}
p{margin:0 0 12px;color:#565656}
a{color:#0E0E0E;font-weight:700}
a.main{color:#E60012}
.links{margin-top:28px}
#going{display:none}
.open #stopped{display:none}
.open #going{display:block}
</style>
</head>
<body>
<main>
<section id="stopped">
<h1>ただいま、新しい登録の受付を止めています。</h1>
<p>講座用のLINE「チエロのAI講座」は、1か月にお送りできるメッセージの数に上限があります。すでに登録した方へのお知らせを上限の中で確実にお送りするため、新しい登録の受付を止めています。</p>
<div class="links">
<p>講座の目次と教材の見本は、講座のページで読めます。<br><a class="main" id="lp" href="https://utage-system.com/p/tyquKDxAqSOo?utm_source=chiero_go&amp;utm_medium=line_paused&amp;utm_campaign=ai_gpt_line&amp;utm_content=none">講座のページを開く</a></p>
<p>講座の一部のレッスンは、YouTubeで無料公開しています。<br><a href="https://www.youtube.com/playlist?list=PLAXYp4vZ3XOs">無料公開レッスンの再生リストを開く</a></p>
</div>
</section>
<section id="going">
<p>LINEの登録ページへ移動しています。</p>
<p>画面が切り替わらない時は、下のリンクから開いてください（LINEアプリで開きます）。</p>
<p><a class="main" id="go">LINEの登録ページへ進む</a></p>
</section>
</main>
<script>
(function () {
  // 識別子 c と、UTAGEの登録経路（シナリオA 8p8wmjZRy3NQ）の対応表。ここ1か所だけに持つ。
  // 足すのは、UTAGEで発行済みの経路だけ。internal_check は入れない。
  var ROUTES = {
    yt_desc_eahMO2HX29s: 'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=4rQ1aggr5Mv6',
    yt_desc_YE4QNBxRSec: 'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=bU70RJu6NQNz',
    yt_desc_nlouj7Zf628: 'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=cl5RrBgLovro',
    yt_desc_RXbeHNT6j34: 'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=KTAArtf54B28',
    yt_desc_ftl937T0jzM: 'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=nU3y1pd3IsDM',
    yt_desc_A9aI2IgCxUk: 'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=YqFSECSAzipR',
    yt_desc_8lwSR3FC8J8: 'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=CXHSwxPIVQJz',
    yt_pin_common:      'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=DnEVxZaUiXuv',
    yt_qr_common:        'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=RP1HcpxiI8ek',
    lp_course:           'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=fUyMbseghjFl',
    ad_pos_a_keihi:      'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=9qi7YQCKwmbx',
    ad_pos_b_gijiroku:   'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=zYiwqLUx8vnF',
    ad_pos_c_shokuba:    'https://utage-system.com/line/open/8p8wmjZRy3NQ?mtid=llESJuZCPNQd'
  };
  var DEFAULT = 'yt_qr_common'; // c が無い時・表に無い時の行き先
  var c = new URLSearchParams(location.search).get('c');

  if (!OPEN) {
    // 止めている間：転送しない。講座のページのリンクに、来た場所（英数字・-・_ の40字以内）だけを utm_content として付ける。
    var lp = document.getElementById('lp');
    var u = new URL(lp.getAttribute('href'));
    u.searchParams.set('utm_content', c && /^[A-Za-z0-9_-]{1,40}$/.test(c) ? c : 'none');
    lp.href = u.href;
    return;
  }

  // 開けている間：表にある識別子だけを使う。URLそのものは外から受け取らない。
  var key = c && Object.prototype.hasOwnProperty.call(ROUTES, c) ? c : DEFAULT;
  var dest = ROUTES[key];
  document.getElementById('go').href = dest;
  location.replace(dest);
})();
</script>
</body>
</html>
