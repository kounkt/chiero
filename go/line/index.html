<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>LINEの登録｜株式会社CHIERO</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
// ==== 受付の切り替え（この1行だけを変える。手順は /go/README.md） ====
// false = 止める（どの識別子で来ても転送しない）／ true = 開ける（下の ROUTES の登録経路へ送る）
var OPEN = true;
// =====================================================================
if (OPEN) document.documentElement.className = 'open';
</script>
<style>
body{margin:0;font-family:"Hiragino Sans","Yu Gothic Medium","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;color:#0E0E0E;background:#FFFFFF;font-size:16px;line-height:1.9;font-feature-settings:"palt" 1}
main{max-width:560px;margin:0 auto;padding:72px 22px}
h1{margin:0 0 20px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;font-size:min(22px,5.6vw);line-height:1.6}
p{margin:0 0 12px;color:#565656}
a{color:#0E0E0E;font-weight:700}
a.main{color:#E60012}
.links{margin-top:28px}
#going{display:none}
.open #stopped{display:none}
.open #going{display:block}
</style>
</head>
<body>
<main>
<section id="stopped">
<h1>チエロ公式LINEの友だち追加は、こちらです。</h1>
<p>友だちに追加すると、無料の特典4つが届きます。</p>
<div class="links">
<p><a class="main" href="https://chiero.jp/go/official/">チエロ公式LINEを友だちに追加する</a></p>
<p>講座の一部のレッスンは、YouTubeで無料公開しています。<br><a href="https://www.youtube.com/playlist?list=PLAXYp4vZ3XOs">無料公開レッスンの再生リストを開く</a></p>
</div>
</section>
<section id="going">
<p>チエロ公式LINEへ移動しています。</p>
<p>画面が切り替わらない時は、下のリンクから開いてください（LINEアプリで開きます）。</p>
<p><a class="main" id="go">チエロ公式LINEへ進む</a></p>
</section>
</main>
<script>
(function () {
  // 識別子 c と行き先の対応表。ここ1か所だけに持つ。
  // 2026-10-18 本人の「はい」（10/18 22:2x）で、自然流入（YouTube・Threads・X・Instagram・TikTok・サイト）と既定の行き先を
  // チエロ【公式】LINE（@980wypbo）への出口ページ /go/official/<出口>/ へ切り替えた。出口ごとの数はそのページで数える。
  // 解約に合わせ、広告（ad_pos_*）・講座のLP（lp_course）・メール（dt05_mail）・動画の QR（yt_qr_common）も公式LINE の出口へ替えた。
  // 戻す時は git の履歴から、替える前の行き先を写す。
  var ROUTES = {
    yt_desc_eahMO2HX29s: '/go/official/yt/',
    yt_desc_YE4QNBxRSec: '/go/official/yt/',
    yt_desc_nlouj7Zf628: '/go/official/yt/',
    yt_desc_RXbeHNT6j34: '/go/official/yt/',
    yt_desc_ftl937T0jzM: '/go/official/yt/',
    yt_desc_A9aI2IgCxUk: '/go/official/yt/',
    yt_desc_8lwSR3FC8J8: '/go/official/yt/',
    yt_desc_UjOGxiaJFag: '/go/official/yt/',
    yt_desc_qeQO428TT8A: '/go/official/yt/',
    'yt_desc_3EX-Esywy8s': '/go/official/yt/',
    yt_desc_Fq8s8oChKBw: '/go/official/yt/',
    yt_desc_8FIq9QlCeWU: '/go/official/yt/',
    yt_desc_ep02:        '/go/official/yt/',
    yt_desc_ep03:        '/go/official/yt/',
    yt_desc_k854J0WQl_k: '/go/official/yt/',
    yt_desc_OEjfhSuhKpk: '/go/official/yt/',
    yt_desc_OoG_IW6eZ3U: '/go/official/yt/',
    yt_desc_HmMsoZGzsxA: '/go/official/yt/',
    yt_desc_T7IgcDMyN7c: '/go/official/yt/',
    yt_desc_sRyMnVoorq4: '/go/official/yt/',
    dt05_mail:           '/go/official/',
    site_top:            '/go/official/',
    yt_pin_common:      '/go/official/yt/',
    yt_qr_common:        '/go/official/yt/', // 動画の中の QR。10/19 は講座用LINE へ向けていたが、解約に合わせ公式LINE の YouTube 出口へ
    lp_course:           '/go/official/',
    threads_common:      '/go/official/th/',
    ig_bio:              '/go/official/',
    tt_bio:              '/go/official/',
    x_bio:               '/go/official/x/',
    ad_pos_a_keihi:      '/go/official/',
    ad_pos_b_gijiroku:   '/go/official/',
    ad_pos_c_shokuba:    '/go/official/'
  };
  var DEFAULT = 'site_top'; // c が無い時・表に無い時の行き先（10/19 から公式LINE の共通の出口。yt_qr_common は講座用LINE）
  var c = new URLSearchParams(location.search).get('c');

  if (!OPEN) return; // 止めている間・JavaScript が動かない間は、上の公式LINE への案内を出す。

  // 開けている間：表にある識別子だけを使う。URLそのものは外から受け取らない。
  var key = c && Object.prototype.hasOwnProperty.call(ROUTES, c) ? c : DEFAULT;
  var dest = ROUTES[key];
  document.getElementById('go').href = dest;
  location.replace(dest);
})();
</script>
</body>
</html>
